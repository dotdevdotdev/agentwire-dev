# Security CI for the damage-control matcher.
#
# Three independent signals:
#   1. bypass-corpus  — the load-bearing gate. Asserts the known evasion vectors
#                       (quoting/escaping, $VAR, substitution, tilde/$HOME secret
#                       reads, non-rm deletion) stay BLOCK/ASK and a corpus of
#                       safe everyday commands keeps PASSing. Merges gate on this.
#   2. bandit         — static scan tuned to a meaningful green gate. Intentional
#                       `shell=True` / localhost `verify=False` sites are skipped in
#                       pyproject [tool.bandit]; the step fails only on NEW
#                       high-severity high-confidence findings.
#   3. pip-audit      — known-vuln scan over the resolved dependency set, on PRs
#                       and a weekly cron.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"  # Mondays 07:00 UTC

jobs:
  bypass-corpus:
    name: damage-control bypass corpus (merge gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Hooks are in sync with _core.py
        run: uv run --no-sync python scripts/regen_damage_control_hooks.py --check
      - name: Run bypass + sync + control-plane corpus
        run: >
          uv run --no-sync pytest -q
          tests/unit/test_damage_control_bypass.py
          tests/unit/test_damage_control_sync.py
          tests/unit/test_control_plane_protection.py

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Meaningful green gate: tuned config (pyproject [tool.bandit]) skips the
      # intentional-by-design test-IDs (subprocess/shell, localhost verify=False,
      # asserts), and we fail only on high-severity high-confidence findings.
      # Green on the clean tree today; red only on NEW genuinely-dangerous code.
      - name: Run bandit
        run: uvx bandit==1.9.4 -c pyproject.toml -r agentwire --severity-level high --confidence-level high

  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    # Advisory, not a merge gate: hard-blocking every PR on transitive CVEs is
    # noise. Keep it running on PRs + the weekly cron for visibility; the
    # damage-control bypass corpus is the hard merge gate. Direct portal-facing
    # deps are bumped explicitly in pyproject; transitive fixes land via lock
    # bumps. See docs/wiki/security/pip-audit.md for the residual-CVE rationale.
    continue-on-error: true
    # The weekly cron opens/updates the tracking issue, which the DEFAULT token
    # does not necessarily allow — a repo set to read-only default permissions
    # would fail the `gh issue` call. Declared explicitly so the durable half of
    # the visibility fix can't silently no-op. (No `pull-requests: write`: this
    # deliberately does not comment on PRs — a fork PR gets a read-only token,
    # so that flow would silently fail for exactly the external contributors it
    # would exist to serve.)
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # PR/push audit is scoped to RUNTIME deps only (--no-dev, no optional
      # extras) so the signal tracks what the default install actually ships.
      # The heavy torch/onnxruntime+gradio chain lives behind the tts/stt
      # extras and is covered by the full audit on the weekly cron below.
      - name: Export runtime (default) dependencies
        run: uv export --no-emit-project --no-dev --format requirements-txt -o requirements.txt
      # Residual starlette CVEs are un-bumpable: starlette is transitive via mcp
      # and the fixes require starlette >=1.0, but the tts extra (gradio ->
      # chatterbox-tts) caps starlette <1.0 in the universal resolution. agentwire
      # speaks MCP over stdio and serves the portal with aiohttp, so starlette's
      # HTTP request-handling CVEs are not on a reachable path. Documented +
      # ignored here so the advisory signal stays meaningful; revisit when mcp /
      # chatterbox-tts relax the ceiling. See docs/wiki/security/pip-audit.md.
      # PYSEC-2026-3483 is the deprecated WebSocket SERVER transport
      # (mcp.server.websocket) missing Host/Origin validation. agentwire runs
      # its MCP server on stdio (mcp_server.py: mcp.run(transport="stdio")) and
      # never imports that module, so it is not on a reachable path. Its fix
      # needs mcp>=1.28.1, which pulls pydantic 2.13 and cascades the tts
      # extra's whole chain (torch 2.6 -> 2.13 plus the CUDA stack, 32 packages)
      # — a bad trade against an unreachable advisory. 1.27.2 clears the other
      # two mcp advisories at a one-package diff. Revisit when the torch bump is
      # wanted on its own merits. See docs/wiki/security/pip-audit.md.
      - name: Audit runtime dependencies
        id: audit
        continue-on-error: true
        run: >
          uvx pip-audit==2.10.1 -r requirements.txt
          --format json --output audit-runtime.json
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln CVE-2026-48818
          --ignore-vuln CVE-2026-48817
          --ignore-vuln CVE-2026-54283
          --ignore-vuln CVE-2026-54282
          --ignore-vuln PYSEC-2026-3483
      # The job stays advisory (continue-on-error above), but its RESULT is no
      # longer invisible: this prints ::warning:: annotations, which GitHub
      # renders on the run and PR checks views without anyone opening the job
      # log, and writes a table to the step summary. `if: always()` so a
      # crashed audit reports "UNKNOWN, which is not clean" rather than nothing
      # — the exact shape of #900, where a red audit rendered as green.
      - name: Report advisories (never blocks)
        if: always()
        run: uv run --no-project python scripts/pip_audit_report.py audit-runtime.json --scope runtime
      # Full audit including optional extras (tts/stt: torch, onnxruntime,
      # gradio, ...). Weekly only and never ignore-filtered — surfaces the full
      # backlog for review without blocking or spamming every PR.
      - name: Export all dependencies (incl. optional extras)
        if: github.event_name == 'schedule'
        run: uv export --no-emit-project --all-extras --format requirements-txt -o requirements-all.txt
      - name: Full audit (weekly cron, optional extras)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: >
          uvx pip-audit==2.10.1 -r requirements-all.txt
          --format json --output audit-all.json
      - name: Report full audit + open/update the tracking issue
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --no-project python scripts/pip_audit_report.py audit-all.json \
            --scope "all extras" --issue-body issue-body.md
          # ONE issue, reused. Annotations and summaries belong to a run nobody
          # revisits; an issue is what actually stops advisories accumulating
          # unseen — which is how #900 reached eight.
          title='pip-audit: unresolved advisories in the dependency lock'
          existing=$(gh issue list --state open --search "$title in:title" \
                       --json number --jq '.[0].number' || true)
          if grep -q ': clean' issue-body.md; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file issue-body.md
              gh issue close "$existing" --comment "pip-audit is clean; closing. It reopens itself if findings return."
            fi
          elif [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --title "$title" --label "area:security" --body-file issue-body.md
          fi
