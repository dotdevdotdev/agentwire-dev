# Engine-free startup smoke (#1308, part of #1307).
#
# agentwire must start from its real dependency set, which contains no
# damage-control engine, and must not reference it at all (#1313, #1316).
# Install it into a fresh venv and run commands that must not need it.
name: no-engine-smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: startup without the engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: No damage_control reference remains in the package
        run: |
          if grep -rn "damage_control" agentwire/; then
            echo "agentwire/ must not reference damage_control" >&2
            exit 1
          fi

      - name: Install agentwire; the engine must not come with it
        run: |
          uv venv "$RUNNER_TEMP/noengine"
          uv pip install --python "$RUNNER_TEMP/noengine/bin/python" .
          if "$RUNNER_TEMP/noengine/bin/python" -c "import damage_control" 2>/dev/null; then
            echo "damage_control is importable, so a dependency pulls it in" >&2
            exit 1
          fi

      - name: Run engine-free commands
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          aw="$RUNNER_TEMP/noengine/bin/agentwire"
          "$aw" --help
          "$aw" list
          "$aw" new --help
          "$aw" portal --help
          "$aw" tasks --help
          "$aw" hooks --help
          "$aw" doctor --help
