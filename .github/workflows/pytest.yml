# Pytest CI gate (#323).
#
# 1,191+ test functions exist in the repo; before this workflow none ran in CI,
# so `main` could (and did, #249) go red unnoticed. This runs the suite on every
# PR and every push to main and is the whole win: a trustworthy green/red signal.
#
# Hermetic by design — the runner has no live tmux session or portal, so tests
# that spawn a real tmux binary (the WS-connect and speak-fanout PTY paths) are
# marked `requires_tmux` and deselected here. They still run locally where tmux
# is on PATH. Per the council guardrail we do NOT chase coverage % or block PRs
# on flaky/tmux-dependent tests.
#
# On pushes to main, coverage is measured and surfaced (term-missing in the log + a table in the
# run's job summary + an uploaded coverage.xml artifact) but is REPORT-ONLY:
# there is deliberately no --cov-fail-under, so a low percentage never reds the
# build. The point is visibility — letting the maintainer spot untested
# new/changed handlers (#487) — not a threshold gate.
name: pytest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      # Pull requests run the FAST set: no coverage tracing (it multiplies
      # runtime on a hosted runner) and no `slow` tests (real git/tmux
      # processes per test). A PR gate that takes 45 minutes gets bypassed.
      - name: Run test suite (fast set)
        if: github.event_name == 'pull_request'
        run: uv run --no-sync pytest -q -m "not requires_tmux and not slow"

      # Pushes to main run everything hermetic, with the report-only coverage.
      - name: Run test suite (full) + coverage
        if: github.event_name != 'pull_request'
        run: >
          uv run --no-sync pytest -q -m "not requires_tmux and not upgrade"
          --cov=agentwire --cov-report=term-missing --cov-report=xml

      - name: Publish coverage summary (report-only)
        if: github.event_name != 'pull_request' && always()
        run: |
          {
            echo '## Coverage (report-only — no threshold gate)'
            echo ''
            echo '```'
            uv run --no-sync coverage report 2>/dev/null || echo 'no coverage data'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage.xml artifact
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # Upgrade test (#1276): the previous release from PyPI, upgraded in place to this checkout, in a
  # fresh HOME. Needs the network and builds two venvs, so it is NOT in the PR gate: it runs on
  # pushes to main and on PRs into a release branch. Budget: ~10 min timeout, ~1 min typical.
  # PyPI index lag is the one flake to rerun, not a reason to skip it.
  upgrade:
    name: upgrade from previous release
    if: github.event_name == 'push' || startsWith(github.base_ref, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Upgrade test
        run: uv run --no-sync pytest -q -m upgrade tests/integration/test_upgrade_from_release.py

  # Scoped-allow mutation check (#1293): scripts/mutate_scoped_allow.py breaks each #914 safety
  # property once and demands a red test. It exits 1 on any surviving mutation AND on a stale
  # anchor (a skipped mutation counts as a survivor), so engine or source drift that silently
  # detaches an anchor turns this job red. Pushes to main only, not the PR gate.
  # Budget: ~10 min timeout, ~30 s typical (19 mutations x one test file).
  mutation:
    name: scoped-allow mutation check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # The script mutates the engine inside this checkout's .venv, so it must exist.
      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Mutation check
        run: uv run --extra dev python scripts/mutate_scoped_allow.py

  # The hook is `python -I -m damage_control.hook` and runs under whatever `python3` the user
  # has; the package's declared floor is 3.9 (#1223: a 3.10-only construct made the hooks crash
  # non-blocking, i.e. fail OPEN). The main job runs 3.12 and cannot see that. agentwire itself
  # needs 3.10, so the AgentWire profile manifest is written under a newer interpreter first and
  # handed to the 3.9 job as a file — exactly how the installed hook receives it.
  hooks-py39:
    name: hook subprocess tests (Python 3.9)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Write the AgentWire profile manifest (3.12)
        run: uv run python scripts/golden_snapshot.py profile --out "$RUNNER_TEMP/dc-profile.json"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # The published engine, at the range agentwire declares (never a checkout copy, #1209 M8).
      - name: Install the damage_control package and test dependencies
        run: python -m pip install pytest "$(grep -o 'damage-control-dev>=[^"]*' pyproject.toml)"

      # --noconftest: tests/conftest.py imports agentwire's full dependency set.
      - name: Run hook tests on the declared floor
        env:
          DC_TEST_PROFILE: ${{ runner.temp }}/dc-profile.json
        run: >
          python -m pytest -q --noconftest -p no:cacheprovider -m "not slow"
          tests/unit/test_hook_subprocess.py
          tests/unit/test_hook_python_floor.py
          tests/unit/test_hook_fail_closed.py
          tests/unit/test_hook_fail_closed_matrix.py
