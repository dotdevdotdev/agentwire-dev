# Remote execution damage control rules
# SSH remote execution safeguards
#
# MOSTLY SUPERSEDED BY THE WRAPPER-PAYLOAD RESCAN (#924). ssh's remote command
# is now extracted and re-scanned as a command in its own right
# (`_ssh_remote_payload` in agentwire/safety/_core.py), so EVERY rule —
# anchored ones included, at real command positions — applies to the wrapped
# form automatically. The hand-written ssh twins of local rules (rm -rf,
# sudo rm, mkfs, dd-to-device, dropdb, mysqladmin drop, redis FLUSHALL,
# docker system prune) were measured redundant against the full corpus and
# deleted; do not add new twins here — a rule written once applies over ssh.
#
# What remains is the ssh-ONLY surface: operations with no local rule twin
# (rebooting/stopping a REMOTE machine is a risk locally unruled), plus one
# rule that is deliberately STRICTER than its local tooldef tier.
#
# WHY THIS FILE STAYS UNANCHORED (#915)
#
# The dangerous text is ssh's quoted payload; `anchored: true` matches against
# masked_subcommands(), which blanks any fully-quoted token containing
# whitespace -- so anchoring would blank exactly the half these rules read.
#
# DO NOT add `anchored: true` to anything in this file. Enforced by
# tests/unit/test_damage_control_payload_anchoring.py.

bashToolPatterns:
  # Remote machine-state operations — no local rule twin exists for these, so
  # the rescan alone leaves them uncovered.
  - pattern: '\bssh\s+.*\breboot\b'
    reason: SSH remote reboot
    ask: true
    anchored: false

  - pattern: '\bssh\s+.*\bshutdown\b'
    reason: SSH remote shutdown
    ask: true
    anchored: false

  - pattern: '\bssh\s+.*\bsystemctl\s+stop\b'
    reason: SSH remote service stop
    ask: true
    anchored: false

  # Deliberately STRICTER than the local tier: `docker rm -f` locally is
  # ask-tier (tooldef); on a remote box it stays a hard block — deleting this
  # twin would downgrade the wrapped form from block to ask.
  - pattern: '\bssh\s+.*\bdocker\s+rm\s+.*-f'
    reason: SSH remote docker rm -f
    anchored: false
