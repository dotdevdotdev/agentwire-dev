# AgentWire infrastructure damage control rules

bashToolPatterns:
  # ---------------------------------------------------------------------------
  # AGENTWIRE INFRASTRUCTURE PROTECTION
  # ---------------------------------------------------------------------------
  # Protect AgentWire's core infrastructure from catastrophic damage
  # AgentWire manages parallel agent sessions via tmux and stores state in ~/.agentwire/

  # Tmux session destruction
  - pattern: '\btmux\s+kill-server\b'
    reason: tmux kill-server (destroys ALL tmux sessions including AgentWire)
    anchored: true

  - pattern: '\btmux\s+kill-session\s+.*\bagentwire'
    reason: tmux kill-session targeting AgentWire sessions
    anchored: true

  - pattern: '\btmux\s+kill-session\s+.*-a\b'
    reason: tmux kill-session -a (kills all except current)
    ask: true
    anchored: true

  # AgentWire CLI destructive commands (future-proofing)
  - pattern: '\bagentwire\s+destroy\b'
    reason: agentwire destroy (if implemented - destroys AgentWire state)
    anchored: true

  - pattern: '\bagentwire\s+.*--force.*remove\b'
    reason: agentwire force remove operations
    anchored: true

  # AgentWire directory destruction — keyed to the OPERATION, not the spelling
  # (#949). The old ``\brm\s+.*\.agentwire`` matched ANY rm that mentioned the
  # path anywhere, so every legitimate single-file cleanup inside the state
  # directory (stale registry entries, dead-letter files, log rotation) was
  # refused with a message claiming the command destroys all state. What is
  # actually worth a hard block here is a recursive/forced rm whose TARGET is
  # the .agentwire directory itself: both a -r/-R/-f (or --recursive/--force)
  # flag AND a path terminating at .agentwire — a nested file cannot destroy
  # the directory and falls through to core.yaml's ordinary (bypassable) rm
  # rules with an honest reason.
  - pattern: '\brm\s+(?:[^;&|]*\s)?-(?:[a-zA-Z]*[rRf][a-zA-Z]*|-recursive|-force)\b[^;&|]*\s(?:(?:~|\$HOME|/Users/[^/\s]+|/home/[^/\s]+)/)?\.agentwire/?(?=\s|$|[;&|])'
    reason: Recursive/forced rm of the .agentwire directory itself (destroys AgentWire state)
    anchored: true

  # Note: `agentwire tasks promote` (#720/#721) is blocked via
  # safety/_core.py's PROTECTED_COMMAND_PATTERNS instead of an ordinary
  # bashToolPatterns entry here — it needs escape-hatch/kill-switch immunity,
  # which only the code-level protected-command check provides (a rule in
  # this file would still be overridable by `# allow:`).
