# Container damage control rules
# Docker and Kubernetes

bashToolPatterns:
  # ---------------------------------------------------------------------------
  # DOCKER DESTRUCTIVE OPERATIONS
  # ---------------------------------------------------------------------------
  - id: containers.docker-system-prune-a-removes-all-unused-data
    pattern: '\bdocker\s+system\s+prune\s+.*-a'
    reason: docker system prune -a (removes all unused data)
    anchored: true

  - id: containers.docker-rmi-f-force-removes-images
    pattern: '\bdocker\s+rmi\s+.*-f'
    reason: docker rmi -f (force removes images)
    anchored: true

  - id: containers.docker-volume-rm-data-loss
    pattern: '\bdocker\s+volume\s+rm\b'
    reason: docker volume rm (data loss)
    anchored: true

  - id: containers.docker-volume-prune-removes-unused-volumes
    pattern: '\bdocker\s+volume\s+prune\b'
    reason: docker volume prune (removes unused volumes)
    anchored: true

  # ---------------------------------------------------------------------------
  # KUBERNETES (kubectl) DESTRUCTIVE OPERATIONS
  # ---------------------------------------------------------------------------
  - id: containers.kubectl-delete-namespace
    pattern: '\bkubectl\s+delete\s+namespace\b'
    reason: kubectl delete namespace
    anchored: true

  - id: containers.kubectl-delete-all-all
    pattern: '\bkubectl\s+delete\s+(?=(?:[^;&|]*\s)?--all(?=[\s;&|)`]|$))(?=(?:[^;&|]*\s)?all(?=[\s;&|)`]|$))'
    pattern_src: '\bkubectl\s+delete\s+(?=(?:[^;&|]*\s)?--all(?=[\s;&|)`]|$))(?=(?:[^;&|]*\s)?all(?=[\s;&|)`]|$))'
    reason: kubectl delete all --all
    anchored: true

  - id: containers.kubectl-delete-across-all-namespaces
    pattern: '\bkubectl\s+delete\s+.*--all\s+--all-namespaces'
    reason: kubectl delete across all namespaces
    anchored: true

  - id: containers.helm-uninstall-removes-release
    pattern: '\bhelm\s+uninstall\b'
    reason: helm uninstall (removes release)
    anchored: true

  # ---------------------------------------------------------------------------
  # CONTAINER REGISTRY PUBLISH / WORKLOAD DELETE (ask: true)
  # ---------------------------------------------------------------------------
  # `docker push` publishes an image (outward-facing) and a generic
  # `kubectl delete <resource>` removes a workload. Previously `allow`-tier.
  # The catastrophic kubectl deletes above are hard-blocked and listed first, so
  # they still block; this generic ask only catches the narrower deletes.
  - pattern: '\bdocker\s+(compose\s+)?push\b'
    reason: docker push (publishes an image to a registry)
    ask: true
    id: container.docker-push
    anchored: true

  - pattern: '\bkubectl\s+delete\b'
    reason: kubectl delete (removes a Kubernetes resource)
    ask: true
    id: container.kubectl-delete
    anchored: true
