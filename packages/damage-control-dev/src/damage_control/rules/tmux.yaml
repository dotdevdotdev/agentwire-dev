# tmux hazards (opt-in pack `tmux`)
#
# Destroying every tmux session at once is a hazard for anyone who keeps
# long-running work in tmux, agent or not.

bashToolPatterns:
  - id: agentwire.tmux-kill-server-destroys-all-tmux-sessions-including-agentw
    pattern: '\btmux\s+kill-server\b'
    reason: tmux kill-server (destroys ALL tmux sessions)
    anchored: true

  - id: agentwire.tmux-kill-session-a-kills-all-except-current
    pattern: '\btmux\s+kill-session\s+.*-a\b'
    reason: tmux kill-session -a (kills all except current)
    ask: true
    anchored: true
